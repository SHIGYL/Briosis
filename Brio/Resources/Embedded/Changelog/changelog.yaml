tagline: "Briosis"
subline: "Community GPose posing toolkit"
changelog:
  - name: "v0.1.0.5"
    tagline: "Facial composition fix"
    date: "October 2nd 2026"
    isCurrent: true
    versions:
      - number: "0.1.0.5"
        icon: ""
        items:
          - "Fixed facial expressions becoming distorted or accumulating when editing unrelated pose bones."
          - "Kept Facial Controls separate from Brio's raw/manual pose cache so expression transforms are not captured back into the pose during bone editing."

  - name: "v0.1.0.4"
    tagline: "Brio 0.8.0.12 stable sync"
    date: "September 30th 2026"
    isCurrent: false
    versions:
      - number: "0.1.0.4"
        icon: ""
        items:
          - "Updated the Briosis base to Brio 0.8.0.12 stable."
          - "Integrated upstream fixes for input, actors, VFX, cameras, overlays, and related GPose systems."
          - "Added relative-position support for Camera and Light presets while preserving existing presets."
          - "Integrated MCDF/STG loading and temporary-file handling fixes."
          - "Fixed misleading error-level log spam during successful MCDF cache generation."
          - "Preserved Briosis facial and tongue tools, Undo/Redo, IPC/Web separation, and GPose conflict protection."

  - name: "v0.1.0.3"
    tagline: "Brio coexistence update"
    date: "September 24th 2026"
    isCurrent: false
    versions:
      - number: "0.1.0.3"
        icon: ""
        items:
          - "Added a GPose-session conflict guard when the original Brio is active."
          - "Moved Briosis IPC providers to their own Briosis.* labels."
          - "Removed the legacy /xat and /mcdf command aliases."
          - "Moved the optional Briosis Web API to localhost:42429/briosis."

  - name: "v0.1.0.2"
    tagline: "Changelog performance hotfix"
    date: "September 24th 2026"
    isCurrent: false
    versions:
      - number: "0.1.0.2"
        icon: ""
        items:
          - "Replaced the legacy Brio changelog with Briosis-specific release notes."
          - "Removed blocking changelog parsing and legacy image loading from the UI draw path."

  - name: "v0.1.0.1"
    tagline: "Hotfix"
    date: "September 24th 2026"
    isCurrent: false
    versions:
      - number: "0.1.0.1"
        icon: ""
        items:
          - "Fixed embedded resource loading after the Briosis project rename."

  - name: "v0.1.0.0"
    tagline: "Initial public release"
    date: "September 24th 2026"
    isCurrent: false
    versions:
      - number: "0.1.0.0"
        icon: ""
        items:
          - "Initial public release."
          - "Added Ktisis-style facial expression controls."
          - "Added Facial Presets."
          - "Added Tongue Profiles and Tongue Tool."
          - "Added procedural Tongue Out controls and manual tongue-bone fine tuning."
          - "Added Undo/Redo integration for facial editing."
