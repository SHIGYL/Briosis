name: Release Briosis

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release metadata and tag
        shell: pwsh
        run: ./scripts/Validate-ReleaseMetadata.ps1 -Tag "${{ github.ref_name }}"

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud-latest.zip
          Expand-Archive -Force dalamud-latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore
        run: dotnet restore Briosis.slnx

      - name: Build and package
        run: dotnet build Briosis.slnx --configuration Release --no-restore

      - name: Validate embedded resources
        shell: pwsh
        run: ./scripts/Validate-EmbeddedResources.ps1

      - name: Verify and stage installable archive
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath Brio/bin/x64/Release -Recurse -Filter latest.zip)
          if ($packages.Count -ne 1) { throw "Expected exactly one Dalamud package, found $($packages.Count)." }
          Copy-Item -LiteralPath $packages[0].FullName -Destination Briosis.zip

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path Briosis.zip))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if ($names -notcontains 'Briosis.dll') { throw 'Briosis.dll is missing from Briosis.zip.' }
            if ($names -notcontains 'Briosis.json') { throw 'Briosis.json is missing from Briosis.zip.' }
          }
          finally {
            $archive.Dispose()
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Briosis.zip --title "Briosis ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
